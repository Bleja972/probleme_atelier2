<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Petits Défis CE1 - Problèmes pages 3 et 4</title>
<style>
:root{
  --navy:#17324d;
  --green:#2f8f57;
  --red:#c94c4c;
  --purple:#6c63d9;
  --orange:#efb46d;
  --cream:#fffaf4;
  --blue:#8fd3ff;
  --pink:#f7b9cb;
  --mint:#a8e4b1;
  --yellow:#ffe18a;
  --lav:#c9bbff;
  --whole:#f4a6a6;
  --border:#ead1ad;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#fff8ef,#f7dfbd);
  color:#222;
}
.app{max-width:1040px;margin:0 auto;padding:18px}
.shell{
  background:#fff;
  border:3px solid #efdbc0;
  box-shadow:0 10px 28px rgba(0,0,0,.10);
  overflow:hidden;
}
header{
  text-align:center;
  padding:18px;
  background:linear-gradient(135deg,#ffe7bd,#ffd49b 55%,#fff0d3);
  border-bottom:3px solid #efd4ad;
}
.brand{
  color:var(--navy);
  font-weight:900;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.5px;
}
h1{margin:8px 0 4px;font-size:clamp(29px,4vw,44px)}
.subtitle{margin:0;color:#5b5b5b;font-size:18px}
main{padding:20px}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px;
}
.stat{
  background:#fff8ef;
  border:2px solid var(--border);
  padding:10px;
  text-align:center;
  color:var(--navy);
  font-weight:900;
}
.stat strong{display:block;font-size:28px;margin-top:4px}
.progress{
  height:14px;background:#f1e4d2;border:1px solid #dfc7a5;margin-bottom:18px;overflow:hidden;
}
.progress div{
  height:100%;width:0;background:linear-gradient(90deg,var(--navy),#52799c);transition:width .25s;
}
.card{
  background:linear-gradient(180deg,#fffdf9,#fff5e8);
  border:2px solid #ecd4b3;
  padding:20px;
}
.tag{
  display:inline-block;background:#ffe4ae;border:2px solid #efc46e;color:var(--navy);
  padding:7px 14px;font-weight:900;margin-bottom:14px;
}
.problem{
  background:white;border:2px solid #eed8bb;border-left:8px solid var(--orange);
  padding:16px;font-size:clamp(20px,3vw,27px);line-height:1.45;font-weight:800;color:var(--navy);
}
.question{margin-top:10px;font-weight:900;color:#111}
.model-title{
  margin:18px 0 10px;font-size:22px;font-weight:900;color:var(--navy);text-align:center;
}
.model{
  background:#fffaf2;border:2px dashed #e6c89b;padding:14px;margin-bottom:16px;
}
.whole{
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--whole);
  border:3px solid #fff;
  font-size:23px;
  font-weight:900;
  color:#512020;
  margin-bottom:8px;
}
.parts{display:flex;width:100%}
.part{
  min-height:68px;display:flex;align-items:center;justify-content:center;padding:7px;
  text-align:center;font-size:20px;font-weight:900;color:var(--navy);border:3px solid #fff;
}
.p1{background:var(--blue)}
.p2{background:var(--mint)}
.p3{background:var(--yellow)}
.p4{background:var(--lav)}
.unknown{
  background:#fff;
  color:#777;
  border:3px solid #fff;
}
.legend{
  text-align:center;color:#666;font-size:15px;margin-top:6px;font-weight:700;
}
.answer-area{margin-top:18px;text-align:center}
.answer-area label{
  display:block;font-size:21px;font-weight:900;color:var(--navy);margin-bottom:9px;
}
.answer-input{
  width:180px;height:58px;border:3px solid var(--navy);background:#fff;color:var(--navy);
  font-size:30px;font-weight:900;text-align:center;outline:none;
}
.answer-input:focus{
  border-color:#f0a24b;box-shadow:0 0 0 4px rgba(240,162,75,.18);
}
.feedback{
  min-height:44px;margin:18px 0 8px;text-align:center;font-size:22px;font-weight:900;line-height:1.35;
}
.actions{
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;
}
.action{
  border:none;color:white;padding:14px 24px;font-size:20px;font-weight:900;cursor:pointer;
}
.check{background:var(--green)}
.next{background:var(--purple);display:none}
.replay{background:var(--navy)}
.end{display:none;text-align:center;padding:30px 12px 14px}
.end h2{font-size:42px;color:var(--navy);margin:0 0 10px}
.end p{font-size:24px;font-weight:900}
.calc{
  margin-top:12px;
  display:inline-block;
  background:#eef6ff;
  color:var(--navy);
  border:2px solid #b9d6eb;
  padding:8px 12px;
  font-weight:900;
}
@media(max-width:700px){
  .stats{grid-template-columns:1fr}
  .part{font-size:16px}
  .answer-input{width:140px}
}
</style>
</head>
<body>
<div class="app">
<div class="shell">

<header>
  <div class="brand">Les Petits Défis CE1</div>
  <h1>Problèmes avec modèles en barres</h1>
  <p class="subtitle">Atelier problème 2 - pages 3 et 4</p>
</header>

<main>
<section id="game">
  <div class="stats">
    <div class="stat">Question<strong id="qnum">1 / 7</strong></div>
    <div class="stat">Score<strong id="score">0</strong></div>
    <div class="stat">Réussites<strong id="good">0</strong></div>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <div class="card">
    <div class="tag" id="tag">Problème 1</div>
    <div class="problem" id="problem"></div>

    <div class="model-title">Modèle en barres</div>
    <div id="model"></div>

    <div class="answer-area">
      <label for="answerInput">Écris ta réponse :</label>
      <input id="answerInput" class="answer-input" type="text" inputmode="numeric" autocomplete="off">
    </div>

    <div class="feedback" id="feedback" aria-live="polite"></div>

    <div class="actions">
      <button class="action check" id="checkBtn" type="button">Vérifier</button>
      <button class="action next" id="nextBtn" type="button">Question suivante</button>
    </div>
  </div>
</section>

<section class="end" id="end">
  <h2>Bravo !</h2>
  <p id="finalText"></p>
  <button class="action replay" id="replayBtn" type="button">Rejouer</button>
</section>
</main>

</div>
</div>

<script>
const problems = [
  {
    tag:"Problème 1",
    text:"Dans mes deux poches, j’ai <strong>20 billes en tout</strong>. J’en ai <strong>9 dans ma poche droite</strong>.<div class='question'>Combien de billes ai-je dans ma poche gauche ?</div>",
    answer:11,
    parts:[
      {label:"? poche gauche", weight:11, unknown:true},
      {label:"9 billes - poche droite", weight:9}
    ],
    calc:"20 - 9 = 11"
  },
  {
    tag:"Problème 2",
    text:"Dans mes deux boîtes, j’ai <strong>24 billes</strong>. J’en ai <strong>10 dans ma boîte verte</strong>.<div class='question'>Combien ai-je de billes dans ma boîte jaune ?</div>",
    answer:14,
    parts:[
      {label:"10 billes - boîte verte", weight:10},
      {label:"? boîte jaune", weight:14, unknown:true}
    ],
    calc:"24 - 10 = 14"
  },
  {
    tag:"Problème 3",
    text:"Dans mes deux boîtes, j’ai <strong>50 billes</strong>. J’en ai <strong>30 dans ma boîte rouge</strong>.<div class='question'>Combien de billes ai-je dans ma boîte bleue ?</div>",
    answer:20,
    parts:[
      {label:"30 billes - boîte rouge", weight:30},
      {label:"? boîte bleue", weight:20, unknown:true}
    ],
    calc:"50 - 30 = 20"
  },
  {
    tag:"Problème 4",
    text:"À la librairie, j’ai acheté <strong>une trousse à 3 euros</strong> et un livre. J’ai payé <strong>14 euros en tout</strong>.<div class='question'>Combien a coûté le livre ?</div>",
    answer:11,
    parts:[
      {label:"3 € - trousse", weight:3},
      {label:"? € - livre", weight:11, unknown:true}
    ],
    calc:"14 - 3 = 11"
  },
  {
    tag:"Problème 5",
    text:"Dans un train, il y a <strong>21 passagers dans le 1er wagon</strong>, <strong>20 dans le 2ème</strong> et <strong>7 dans le 3ème</strong>.<div class='question'>Combien de passagers y a-t-il dans ce train ?</div>",
    answer:48,
    parts:[
      {label:"21 - 1er wagon", weight:21},
      {label:"20 - 2ème wagon", weight:20},
      {label:"7 - 3ème wagon", weight:7}
    ],
    calc:"21 + 20 + 7 = 48"
  },
  {
    tag:"Problème 6",
    text:"Dans la ferme, il y a <strong>38 animaux</strong> : <strong>23 vaches</strong>, <strong>2 chevaux</strong> et des moutons.<div class='question'>Combien de moutons y a-t-il ?</div>",
    answer:13,
    parts:[
      {label:"23 vaches", weight:23},
      {label:"2 chevaux", weight:2},
      {label:"? moutons", weight:13, unknown:true}
    ],
    calc:"38 - 23 - 2 = 13"
  },
  {
    tag:"Problème 7",
    text:"Ugo a acheté <strong>3 stylos à 5 euros chacun</strong> et <strong>une bande dessinée à 7 euros</strong>.<div class='question'>Combien a-t-il dépensé ?</div>",
    answer:22,
    parts:[
      {label:"5 € - stylo", weight:5},
      {label:"5 € - stylo", weight:5},
      {label:"5 € - stylo", weight:5},
      {label:"7 € - BD", weight:7}
    ],
    calc:"5 + 5 + 5 + 7 = 22"
  }
];

let current=0, score=0, good=0, locked=false;

const qnum=document.getElementById("qnum");
const scoreEl=document.getElementById("score");
const goodEl=document.getElementById("good");
const bar=document.getElementById("bar");
const tag=document.getElementById("tag");
const problem=document.getElementById("problem");
const model=document.getElementById("model");
const input=document.getElementById("answerInput");
const feedback=document.getElementById("feedback");
const checkBtn=document.getElementById("checkBtn");
const nextBtn=document.getElementById("nextBtn");
const game=document.getElementById("game");
const end=document.getElementById("end");
const finalText=document.getElementById("finalText");
const replayBtn=document.getElementById("replayBtn");

function renderModel(p){
  model.innerHTML="";
  const box=document.createElement("div");
  box.className="model";

  const whole=document.createElement("div");
  whole.className="whole";
  whole.textContent="Le Tout";
  box.appendChild(whole);

  const parts=document.createElement("div");
  parts.className="parts";

  p.parts.forEach((item,i)=>{
    const part=document.createElement("div");
    part.className="part p"+((i%4)+1)+(item.unknown?" unknown":"");
    part.textContent=item.label;
    part.style.flex=String(item.weight);
    parts.appendChild(part);
  });

  box.appendChild(parts);

  const legend=document.createElement("div");
  legend.className="legend";
  legend.textContent="Les parties forment Le Tout.";
  box.appendChild(legend);

  model.appendChild(box);
}

function render(){
  locked=false;
  const p=problems[current];

  qnum.textContent=`${current+1} / ${problems.length}`;
  scoreEl.textContent=score;
  goodEl.textContent=good;
  bar.style.width=`${current/problems.length*100}%`;

  tag.textContent=p.tag;
  problem.innerHTML=p.text;
  renderModel(p);

  input.value="";
  input.disabled=false;
  input.style.borderColor="var(--navy)";
  input.style.background="#ffffff";

  feedback.textContent="";
  checkBtn.style.display="inline-block";
  checkBtn.disabled=false;
  nextBtn.style.display="none";

  setTimeout(()=>input.focus(),50);
}

function validate(){
  if(locked)return;

  if(input.value.trim()===""){
    feedback.style.color="var(--red)";
    feedback.textContent="Écris une réponse.";
    return;
  }

  const p=problems[current];
  const value=Number(input.value);

  locked=true;
  input.disabled=true;
  checkBtn.disabled=true;

  if(value===p.answer){
    score++;
    good++;
    input.style.borderColor="var(--green)";
    input.style.background="#ffffff";
    feedback.style.color="var(--green)";
    feedback.innerHTML=`Bravo ! Bonne réponse.<br><span class="calc">${p.calc}</span>`;
  }else{
    input.style.borderColor="var(--red)";
    input.style.background="#ffffff";
    feedback.style.color="var(--red)";
    feedback.innerHTML=`La bonne réponse est <strong>${p.answer}</strong>.<br><span class="calc">${p.calc}</span>`;
  }

  scoreEl.textContent=score;
  goodEl.textContent=good;
  bar.style.width=`${(current+1)/problems.length*100}%`;
  nextBtn.style.display="inline-block";
}

function nextQuestion(){
  if(!locked)return;
  current++;
  if(current>=problems.length){
    game.style.display="none";
    end.style.display="block";

    let txt=`Tu as obtenu ${score} bonne${score>1?"s":""} réponse${score>1?"s":""} sur ${problems.length}.`;
    if(score===7) txt+=" C’est un sans-faute !";
    else if(score>=5) txt+=" Très bon travail !";
    else txt+=" Continue à t’entraîner avec les modèles en barres.";

    finalText.textContent=txt;
    return;
  }
  render();
}

function replay(){
  current=0;
  score=0;
  good=0;
  game.style.display="block";
  end.style.display="none";
  render();
}

input.addEventListener("input",()=>{
  input.value=input.value.replace(/[^0-9]/g,"");
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(locked) nextQuestion();
    else validate();
  }
});

checkBtn.addEventListener("click",validate);
nextBtn.addEventListener("click",nextQuestion);
replayBtn.addEventListener("click",replay);

render();
</script>
</body>
</html>
